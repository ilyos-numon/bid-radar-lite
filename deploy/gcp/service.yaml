# Cloud Run 서비스 (Knative Service 형식). 적용: gcloud run services replace deploy/gcp/service.yaml --region=asia-northeast3
# 전체 설정은 deploy/gcp/apply-env.sh 가 ${IMAGE}·<PROJECT_ID>·<도메인>·<project-ref> 와 평문 값을 채워 적용한다 (deploy/README.md 4단계). 자동 배포는 이미지만 바꾼다.
# <도메인> 은 별도 도메인이 아니라 Cloud Run 서비스 URL 의 호스트(…run.app)다. 도메인 매핑·부하분산기는 쓰지 않는다.
# 비밀 10개는 Secret Manager 에서 읽는다 (비밀 이름 = 환경변수 이름, 버전 latest). 목록은 deploy/env.production.example 의 SECRET 구역과 같아야 한다.
# 비용: 요청이 없으면 인스턴스 0 (minScale 0), 최대 1 (maxScale 1), 요청 처리 중에만 CPU (cpu-throttling true).
# 대기열·예약 실행 없음 (APP_WORKER=0, APP_SCHEDULER_OFF=1). 수집은 하루 첫 방문 요청이 앱 자신의 잡 주소를 부른다.
# scripts/check-deploy.mjs 가 이 주석 아래 값을 검사한다.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bid-radar-lite
  labels:
    cloud.googleapis.com/location: asia-northeast3
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: bid-radar-run@<PROJECT_ID>.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: "${IMAGE}"
          ports:
            - name: http1
              containerPort: 8820
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8820
            periodSeconds: 5
            failureThreshold: 12
          env:
            - name: APP_TRUST_PROXY
              value: "1"
            - name: APP_COOKIE_SECURE
              value: "1"
            - name: APP_LOG_LEVEL
              value: info
            - name: APP_WORKER
              value: "0"
            # 예약 실행 없음: 하루 첫 방문이 공고 수집·데모 초기화를 시작한다. 회사별 무료 가져오기 횟수·수집 요청 하나의 최대 시간(ms)
            - name: APP_SCHEDULER_OFF
              value: "1"
            - name: APP_FREE_COLLECTS
              value: "5"
            - name: APP_DAY_START_MAX_MS
              value: "240000"
            - name: APP_BASE_URL
              value: "https://<도메인>"
            - name: APP_SIGNUP_MODE
              value: open
            - name: APP_SHARED_KEYS
              value: "1"
            # 공용 LLM·지원사업 API 주소 (비우면 그 기능은 "준비 안 됨")
            - name: LLM_API_BASE
              value: ""
            - name: SUPPORT_API_BASE
              value: ""
            - name: SUPABASE_URL
              value: "https://<project-ref>.supabase.co"
            - name: SUPABASE_ANON_KEY
              value: ""
            - name: TOSS_CLIENT_KEY
              value: ""
            - name: TOSS_API_BASE
              value: "https://api.tosspayments.com"
            - name: APP_TRIAL_DAYS
              value: "14"
            - name: APP_BILLING_RETRY_DAYS
              value: "1,3,7"
            - name: EMAIL_API_BASE
              value: "https://api.resend.com"
            - name: EMAIL_FROM
              value: ""
            - name: LEGAL_TERMS_VERSION
              value: "2026-11-03"
            - name: LEGAL_PRIVACY_VERSION
              value: "2026-11-03"
            # 사업자 정보: 비워 두면 화면에 "미설정". 실제 값은 운영자가 채운다 (저장소에 커밋하지 않으려면 콘솔·gcloud 로 덮어쓴다)
            - name: BUSINESS_NAME
              value: ""
            - name: BUSINESS_REP
              value: ""
            - name: BUSINESS_REG_NO
              value: ""
            - name: BUSINESS_MAIL_ORDER_NO
              value: ""
            - name: BUSINESS_ADDRESS
              value: ""
            - name: BUSINESS_EMAIL
              value: ""
            - name: BUSINESS_PHONE
              value: ""
            - name: PRIVACY_OFFICER
              value: ""
            # 데모 (예시 회사로 둘러보기, 매일 첫 방문 때 초기화)·운영자 화면·가입 봇 확인 (사이트 키가 비면 꺼짐)
            - name: APP_DEMO
              value: "1"
            - name: APP_DEMO_EMAIL_DOMAIN
              value: "demo.example.com"
            - name: APP_PLATFORM_ADMIN_EMAILS
              value: ""
            - name: TURNSTILE_SITE_KEY
              value: ""
            # 비용 상한: KST 하루 예산 (0 = 무제한)·속도 규칙 배수·요청 본문 상한·요청 처리 상한
            - name: APP_DAILY_MAX_EMAIL
              value: "200"
            - name: APP_DAILY_MAX_LLM
              value: "200"
            - name: APP_DAILY_MAX_SIGNUP
              value: "50"
            - name: APP_DAILY_MAX_DEMO_LOGIN
              value: "500"
            - name: APP_RATE_SCALE
              value: "1"
            - name: APP_BODY_LIMIT_BYTES
              value: "262144"
            - name: APP_REQUEST_TIMEOUT_MS
              value: "30000"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: APP_SECRET
                  key: latest
            - name: APP_JOB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: APP_JOB_TOKEN
                  key: latest
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: SUPABASE_SERVICE_ROLE_KEY
                  key: latest
            - name: APP_DB_URL
              valueFrom:
                secretKeyRef:
                  name: APP_DB_URL
                  key: latest
            - name: TOSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: TOSS_SECRET_KEY
                  key: latest
            - name: EMAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: EMAIL_API_KEY
                  key: latest
            - name: NARA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: NARA_API_KEY
                  key: latest
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: LLM_API_KEY
                  key: latest
            - name: SUPPORT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: SUPPORT_API_KEY
                  key: latest
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: TURNSTILE_SECRET_KEY
                  key: latest
